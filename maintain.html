<!DOCTYPE html>
<html>
<head>
    <title>Exam System</title>
    <style>
        body{
            font-family:Arial;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }
        .box{
            background:white;
            padding:40px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
            text-align:center;
        }
        h1{
            color:#003f8c;
        }
        p{
            color:#666;
        }
    </style>
</head>
<body>
<div class="box">
    <h1>Exam System</h1>
    <h2>🚧 Server Under Maintenance</h2>
    <p>Our server is currently offline.</p>
    <p>Please try again after some time.</p>
</div>
</body>
</html>
